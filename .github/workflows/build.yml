name: Build PingDoctor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PingDoctor-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.2.1
        name: "PingDoctor v1.2.1 - Responsive UI & BiDi Fix"
        body: |
          ### ⚡ PingDoctor v1.2.1 - Responsive UI & RTL/BiDi Alignment
          - **Responsive Action Grid**: Replaced cramped 4-button row with spacious 2x2 grid and full-width Hero Test button
          - **No Broken Persian Words**: Words no longer wrap or truncate vertically
          - **BiDi Latency Alignment**: Fixed `ms 378` and parentheses misalignment to standard `378 ms`
          - **Subscription URL Importer & QR Code Generator**
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
