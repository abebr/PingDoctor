name: Build PingDoctor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PingDoctor-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.1.0
        name: "PingDoctor v1.1.0"
        body: |
          ### ⚡ PingDoctor v1.1.0 - YouTube & Telegram Target Probe
          - **Real Service Testing**: Dedicated probe for YouTube, Google, Telegram & Cloudflare
          - **End-to-End VLESS & Trojan Packet Probing**: Validates actual HTTP response bytes from target
          - **Fast Filter Chips**: Filter by All, Alive (🟢), or Dead (🔴)
          - **One-Tap Purge Dead & Copy Alive**
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
